name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Restore dependencies
      run: dotnet restore learning-aspire.sln
      
    - name: Build solution
      run: dotnet build learning-aspire.sln --configuration Release --no-restore /warnaserror
      
    - name: Run tests
      run: dotnet test learning-aspire.sln --configuration Release --no-build --verbosity normal
